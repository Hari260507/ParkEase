
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parking Slot - ParkEase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Book Parking Slot</h1>
    <p>Saved details will be filled automatically.</p>

    <label for="slot">Selected Slot</label>
    <input type="text" id="slot" readonly>

    <label for="customerName">Name</label>
    <input type="text" id="customerName" readonly>

    <label for="vehicle">Vehicle Number</label>
    <input type="text" id="vehicle" placeholder="Vehicle Number">

    <label for="date">Parking Date</label>
    <input type="date" id="date">

    <label for="time">Start Time</label>
    <input type="time" id="time">

    <label for="duration">Parking Duration</label>
    <select id="duration" onchange="checkCustom()">
        <option value="">Select Parking Duration</option>
        <option value="1">1 Hour</option>
        <option value="2">2 Hours</option>
        <option value="3">3 Hours</option>
        <option value="4">4 Hours</option>
        <option value="5">5 Hours</option>
        <option value="custom">Custom Duration</option>
    </select>

    <div id="customDuration" style="display:none;">
        <input type="number" id="customHours" placeholder="Hours" min="0" max="24">
        <input type="number" id="customMinutes" placeholder="Minutes" min="0" max="59">
    </div>

    <p id="endTime"></p>
    <button onclick="confirmBooking()">Confirm Booking</button>
    <button onclick="goDashboard()">Back to Dashboard</button>
</div>

<script src="api.js"></script>
<script>

const params=new URLSearchParams(location.search), selectedSlot=params.get("slot");
let user=null;
(async function init(){
 try { user=(await apiRequest("/api/me")).user; }
 catch(e){alert("Please login first.");location.href="login.html";return;}
 document.getElementById("slot").value=selectedSlot||"";
 document.getElementById("customerName").value=user.name||"";
 document.getElementById("vehicle").value=user.vehicle||"";
 if(!selectedSlot||!/^A([1-9]|[1-9][0-9]|100)$/.test(selectedSlot)){alert("Please select a valid parking slot.");location.href="dashboard.html";return;}
 const d=new Date();document.getElementById("date").min=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
})();
function checkCustom(){document.getElementById("customDuration").style.display=document.getElementById("duration").value==="custom"?"block":"none";updateEndTime();}
function getTotalMinutes(){const v=document.getElementById("duration").value;if(v==="custom"){const h=Number(document.getElementById("customHours").value)||0,m=Number(document.getElementById("customMinutes").value)||0;if(h<0||h>24||m<0||m>59)return 0;return h*60+m;}return Number(v)*60||0;}
function updateEndTime(){const d=document.getElementById("date").value,t=document.getElementById("time").value,m=getTotalMinutes();if(!d||!t||!m){document.getElementById("endTime").textContent="";return;}document.getElementById("endTime").textContent="Expected end time: "+new Date(new Date(d+"T"+t).getTime()+m*60000).toLocaleString();}
["date","time","duration","customHours","customMinutes"].forEach(id=>document.getElementById(id).addEventListener("input",updateEndTime));
async function confirmBooking(){
 const vehicle=document.getElementById("vehicle").value.trim().toUpperCase(),date=document.getElementById("date").value,time=document.getElementById("time").value,duration=getTotalMinutes();
 if(!vehicle||!date||!time||!duration){alert("Please fill all the details and select a valid duration.");return;}
 if(duration>1440){alert("Maximum parking duration is 24 hours.");return;}
 if(new Date(date+"T"+time)<=new Date()){alert("Please select a future date and time.");return;}
 try {const result=await apiRequest("/api/bookings",{method:"POST",body:JSON.stringify({slot:selectedSlot,vehicle,date,time,duration})});sessionStorage.setItem("latestBookingId",result.booking.id);location.href="confirmation.html?id="+result.booking.id;}
 catch(e){alert(e.message);}
}
function goDashboard(){location.href="dashboard.html";}

</script>
</body>
</html>
